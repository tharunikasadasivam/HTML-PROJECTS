<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player UI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="player">
    <div class="cover">
      <img src="vazhithunaiye.jpeg" alt="Song Cover">
    </div>

    <h2 class="song-title">Vazhithunaiye</h2>
    <p class="artist">Ed Sheeran</p>

    <div class="progress-container">
      <div class="progress"></div>
    </div>

    <div class="time">
      <span>0:00</span>
      <span>4:23</span>
    </div>

    <div class="controls">
      <i class="fas fa-backward"></i>
      <div class="play-btn">
        <i class="fas fa-play"></i>
      </div>
      <i class="fas fa-forward"></i>
    </div>
  </div>

</body>
</html>
